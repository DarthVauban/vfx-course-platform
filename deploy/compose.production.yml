services:
  web:
    image: ghcr.io/darthvauban/vfx-course-platform:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    init: true
    networks:
      proxy:
        aliases:
          - vfx-course-platform-web
