<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>VFX Course Platform</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #090b12;
        color: #f5f7ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 10%, #2d1a62 0, transparent 36rem),
          radial-gradient(circle at 80% 90%, #123d5b 0, transparent 32rem),
          #090b12;
      }

      main {
        width: min(42rem, calc(100% - 2rem));
        padding: 3rem;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 1.5rem;
        background: rgb(15 18 30 / 82%);
        box-shadow: 0 2rem 7rem rgb(0 0 0 / 45%);
        backdrop-filter: blur(1.5rem);
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #8fdcff;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 7vw, 4.5rem);
        line-height: 0.96;
      }

      p {
        margin: 1.5rem 0 0;
        color: #b8c0d9;
        font-size: 1.1rem;
        line-height: 1.7;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        margin-top: 2rem;
        padding: 0.65rem 0.9rem;
        border: 1px solid rgb(143 220 255 / 24%);
        border-radius: 999px;
        color: #dff7ff;
        background: rgb(143 220 255 / 8%);
      }

      .status::before {
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 50%;
        background: #58e6a9;
        box-shadow: 0 0 1rem #58e6a9;
        content: "";
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Stylized VFX · Unreal Engine · Niagara</p>
      <h1>Платформа готується</h1>
      <p>
        Сервер і автоматичний деплой уже налаштовуються. Повноцінний навчальний
        портал з матеріалами курсу з’явиться тут наступним етапом.
      </p>
      <div class="status">Deployment pipeline online</div>
    </main>
  </body>
</html>
